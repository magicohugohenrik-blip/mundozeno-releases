<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Mundo Zeno — sem internet</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 30% 20%, #1e3a8a, #0b1020 70%);
        color: #f8fafc;
        font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 2rem;
      }
      .card {
        max-width: 34rem;
        width: 100%;
        text-align: center;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 2rem;
        padding: 2.5rem 2rem;
      }
      h1 { font-size: 1.75rem; margin: 0 0 0.75rem; }
      p { margin: 0 0 1.75rem; color: #cbd5e1; }
      .actions { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
      button {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font: inherit;
        font-weight: 600;
        padding: 0.85rem 1.5rem;
        border-radius: 999px;
        border: 1px solid transparent;
        cursor: pointer;
      }
      .primary { background: #38bdf8; color: #08203a; }
      .secondary { background: transparent; color: #f8fafc; border-color: rgba(255, 255, 255, 0.35); }
      svg { width: 20px; height: 20px; }
    </style>
  </head>
  <body>
    <div class="card">
      <svg viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" style="width:56px;height:56px;margin-bottom:1rem">
        <path d="M2 8.8a16 16 0 0 1 20 0" />
        <path d="M5 12.5a11 11 0 0 1 14 0" />
        <path d="M8.5 16.2a6 6 0 0 1 7 0" />
        <circle cx="12" cy="20" r="1" fill="#38bdf8" />
        <path d="M3 3l18 18" stroke="#f87171" />
      </svg>
      <h1>Sem conexão com a internet</h1>
      <p>
        A mesa continua funcionando normalmente. Os jogos e os relatórios ficam guardados
        no próprio aparelho e são enviados sozinhos quando a internet voltar.
      </p>
      <div class="actions">
        <button class="primary" onclick="window.zenoOffline && window.zenoOffline.goHome()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 10.5 12 3l9 7.5" /><path d="M5 9.8V21h14V9.8" />
          </svg>
          Voltar para o início
        </button>
        <button class="secondary" onclick="window.zenoOffline && window.zenoOffline.retry()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-3-6.7" /><path d="M21 3v6h-6" />
          </svg>
          Tentar de novo
        </button>
      </div>
    </div>
  </body>
</html>
